[project]
name = "projet-web-scrapp"
version = "0.1.0"
description = "Amazon Review Scraper API - Scraping automatisé des avis produits Amazon FR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "fastapi>=0.128.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "selenium>=4.39.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "uvicorn[standard]>=0.40.0",
    "webdriver-manager>=4.0.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "undetected-chromedriver>=3.5.5",
    "beautifulsoup4>=4.14.3",
    "sqlalchemy>=2.0.46",
    "ruff>=0.14.10",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "langdetect>=1.0.9",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
